# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-07-16" # crafting.md formulas added

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: tower_max_hp
    status: active
    source: design/gdd/tower.md
    referenced_by:
      - design/gdd/tower.md
    variables:
      - hp_base
      - tier_multiplier
    output_range: [80, 1000]
    expression: "hp_base × tier_multiplier"
    notes: "hp_base range: 80–400 (Foundation component stat). tier_multiplier:
      Tier 1=1.0, Tier 2=1.5, Tier 3=2.0, Tier 4=2.5. Output feeds boss damage
      calibration (tower_hp_boss_damage_provisional_range). Monster GDD Formula 3
      (boss_attack_damage) references this formula for calibration. HP resets to max on
      wave_completed; pure HP with no mitigation at MVP."
    added: 2026-04-22
    revised: ""

  - name: monster_hp_scaling
    status: active
    source: design/gdd/monster.md
    referenced_by:
      - design/gdd/monster.md
    variables:
      - base_hp
      - wave_hp_multiplier
      - difficulty_hp_multiplier
    output_range: [40, 3840]
    expression: "base_hp × (1 + hp_wave_growth_rate × (wave_index - 1)) × (1 + hp_difficulty_growth_rate × (difficulty_tier - 1))"
    notes: "Linear HP scaling per wave. Default rates: hp_wave_growth_rate=0.15,
      hp_difficulty_growth_rate=0.35. Ceiling 3840 = base_hp(800) × wave8_mult(2.40) ×
      brutal_mult(2.00) at max knobs — STANDARD Wave 8. ELITE Penultimate Wave (N-1)
      ceiling in a 5-wave mission (wave 4 is penultimate): 800 × 1.60 × 2.00 × 1.40 = 3584
      — lower than STANDARD Wave 8 because elite_penultimate_wave_hp_amplifier applies only
      on `is_penultimate_wave == true` (Wave Manager Rule 15c). STANDARD Wave 8 is always
      the true HP ceiling. Output feeds Damage
      & Status GDD (lethal hit threshold) and Wave Manager GDD (wave pacing calibration).
      Referenced by tower_max_hp formula for boss calibration cross-check."
    added: 2026-04-23
    revised: "2026-05-12"

  - name: monster_speed_scaling
    status: active
    source: design/gdd/monster.md
    referenced_by:
      - design/gdd/monster.md
    variables:
      - base_speed
      - wave_speed_multiplier
      - tarot_speed_scalar
    output_range: [0.25, 10.2]
    expression: "base_speed × (1 + speed_wave_growth_rate × (wave_index - 1)) × tarot_speed_scalar"
    notes: "speed_wave_growth_rate default: 0.06 (deliberately lower than HP rate).
      tarot_speed_scalar: 1.0 default, range 0.50–2.00 from mission_modifier_applied.
      Floored at 0.1 cells/sec in implementation. Tarot GDD must use this formula
      when defining monster_speed_scalar modifier bounds."
    added: 2026-04-23
    revised: ""

  - name: boss_attack_damage
    status: active
    source: design/gdd/monster.md
    referenced_by:
      - design/gdd/monster.md
      - design/gdd/tower.md
    variables:
      - base_damage
      - boss_dmg_wave_growth_rate
      - wave_index
    output_range: [15, 136]
    expression: "base_damage × (1 + boss_dmg_wave_growth_rate × (wave_index - 1))"
    notes: "Two BOSS calibration tiers: early-wave BOSSes use base_damage 15–25
      (Tier 1 falls in 3–5 hits); final-wave BOSSes use base_damage 55–80 (Tier 4
      survives 8–15 hits). boss_dmg_wave_growth_rate default: 0.10. Output applied
      directly to tower HP via boss_tower_attack_attempted event — no mitigation at MVP.
      Must stay within tower_hp_boss_damage_provisional_range [40–200] for final-wave
      BOSSes. Tower System GDD constraint tower_max_hp cross-referenced.
      Output range corrected 2026-05-01: max was incorrectly listed as 164; formula
      at max params (base_damage=80, wave_index=8, rate=0.10) gives 80 × 1.70 = 136.
      base_damage floor corrected 2026-07-15 (/design-review monster.md): was 40,
      raised to 55 to fix an 18-hits-vs-15-target boundary failure at wave 5."
    added: 2026-04-23
    revised: "2026-07-15"

  - name: crafting_material_qty
    status: active
    source: design/gdd/crafting.md
    referenced_by:
      - design/gdd/crafting.md
      - design/gdd/equipment-forge.md
    variables:
      - base_qty[rarity]
      - T
      - tier_dps_multiplier
    output_range: [2, 32]
    expression: "round(base_qty[rarity] × tier_dps_multiplier(T))"
    notes: "Tower Component recipe material cost, per rarity tier (Common/Uncommon/Rare)
      and recipe quality_tier T (1-4). base_qty defaults: Common=8, Uncommon=4, Rare=2.
      Deliberately reuses tower.md's tier_dps_multiplier {1.0, 1.6, 2.4, 4.0} (not
      redefined here) so material cost-per-power stays constant across the tier ladder.
      Worked table: T1=8 Common only; T2=13 Common+6 Uncommon; T3=19 Common+10 Uncommon;
      T4=32 Common+16 Uncommon+8 Rare. Any change to tower.md's tier_dps_multiplier
      automatically re-scales this formula's output — do not fork a separate copy.
      Formula 3 (crafting_repair_common_qty) shares the same tier_dps_multiplier
      dependency."
    added: 2026-07-16
    revised: ""

  - name: crafting_repair_common_qty
    status: active
    source: design/gdd/crafting.md
    referenced_by:
      - design/gdd/crafting.md
    variables:
      - base_repair_common
      - T
      - tier_dps_multiplier
    output_range: [4, 16]
    expression: "round(base_repair_common × tier_dps_multiplier(T))"
    notes: "Component repair material cost — Common material only regardless of the
      component's original tier's rarity requirements (deliberate: keeps repair
      cheaper than recrafting and avoids re-demanding Uncommon/Rare). base_repair_common
      default: 4. T is the component instance's own quality_tier at crafting time, read
      from the instance, not re-rolled. Closes tower.md's OQ-12 (component repair,
      previously unowned by any system). Worked table: T1=4, T2=6, T3=10, T4=16 Common,
      roughly 46-53% of the equivalent fresh-craft Common-only cost at each tier."
    added: 2026-07-16
    revised: ""

  - name: equipment_forge_sacrifice_quality_tier
    status: active
    source: design/gdd/equipment-forge.md
    referenced_by:
      - design/gdd/equipment-forge.md
      - design/gdd/menagerie.md
    variables:
      - species_tier
    output_range: [2, 4]
    expression: "quality_tier(species_tier) = clamp(species_tier + 1, 1, 4)"
    notes: "Formula 2 in equipment-forge.md. Closes menagerie.md's own open
      question — what creature_sacrificed's target_item_id refers to: a NEW item
      Equipment Forge creates in the same operation that requests the sacrifice
      (via a new, not-yet-implemented Menagerie.request_sacrifice(creature_id,
      target_item_id) API). species_tier comes from menagerie.md Core Rule 1
      (Common=1/Uncommon=2/Rare=3). Deliberate design intent: a sacrifice-born
      item is never quality_tier 1 (the +1 offset), reflecting that surrendering
      a tended creature is a costlier, more special source than a baseline
      material-only craft. The clamp floor is defensive only — never actually
      reached given species_tier's bounded [1,3] range."
    added: 2026-07-17
    revised: ""

  - name: hero_ultimate_id_derivation
    status: active
    source: design/gdd/hero-skill-build.md
    referenced_by:
      - design/gdd/hero-skill-build.md
      - design/gdd/hero.md
    variables:
      - category_count
      - shape
      - dominant
      - catA
      - catB
    output_range: []
    expression: "Formula 3 in hero-skill-build.md: 4 active skill slots -> category_count vector (Formula 1) -> one of 5 partition shapes (Formula 2: PURE/TRIPLE/DOUBLE_DOUBLE/DOUBLE_SINGLE_SINGLE/ALL_DIFFERENT) -> one of 19 fixed ultimate_id strings (Formula 3), or EMPTY if fewer than 4 slots filled"
    notes: "SOLVES the combinatorial-explosion risk explicitly named in game-concept.md's
      High-Risk Systems table ('4 active skills x N possible combinations... without
      constraints, the balance surface becomes unmanageable'). Ultimate is derived
      from the CATEGORY-COUNT PROFILE of the 4 equipped skills, not their literal
      skill_id identities — categories are the 4 fixed values physical/ranged/
      elemental/support (reused verbatim from tower.md's Foundation archetype enum,
      see hero_skill_category below). This collapses C(7,4)=35 raw category-count
      profiles (a proven combinatorics identity, size-4 multisets over 4 categories)
      onto exactly 19 distinct ultimate_id values — and this matrix is provably
      catalogue-size-independent: growing the skill catalogue from 8 to 20+ skills
      never grows the 35/19 counts, since only category membership matters, not
      skill count per category. Closes hero.md's own Open Question 3 ('Ultimate
      lookup table authorship'). The full 19-entry table is hand-authored in
      hero-skill-build.md Formula 3 with a mathematical exhaustiveness proof (5
      partitions of the integer 4 is a closed, complete enumeration in elementary
      number theory) — no NONE/unclassified fallback is ever reachable for valid
      catalogue data; it exists only as a defensive guard against a data-integrity
      bug, per hero.md's own pre-existing 'if no table entry, resolve to NONE'
      edge case."
    added: 2026-07-17
    revised: ""

  - name: cell_size
    status: active
    source: design/gdd/mission-select.md
    referenced_by:
      - design/gdd/mission-select.md
      - design/gdd/grid-system.md
    value: 64.0
    unit: world units per grid cell
    notes: "CLOSES grid-system.md's Open Question OQ-4 ('Is cell_size a constant
      per project or truly per-mission?'). Resolution (mission-select.md Core Rule
      2): cell_size is a FIXED project-wide constant, 64.0, for every mission,
      always — not per-mission. Rationale: no other GDD's formulas/tuning
      knobs/visual calibration scale with a varying cell_size (tower_attack_range_cells_max=8,
      hero_class_proximity_radius_cells=3 are both calibrated once, in cell units,
      against a single implicit physical scale). The actual mission-shape/pacing
      lever is grid_cols x grid_rows + _cell_types layout (already per-mission via
      GridConfig), not cell_size. GridConfig's schema is unchanged (still carries
      a cell_size field, unbroken API) — only the content-authoring discipline
      changes: Mission Select's MissionEntry authoring tool must always populate
      it with this fixed value."
    added: 2026-07-17
    revised: ""

  - name: tower_mastery_build_signature
    status: active
    source: design/gdd/tower-mastery.md
    referenced_by:
      - design/gdd/tower-mastery.md
    variables:
      - foundation_component_id
      - weapon_component_id
      - focus_component_id
      - power_component_id
    output_range: []
    expression: "foundation_component_id + \"|\" + weapon_component_id + \"|\" + focus_component_id + \"|\" + power_component_id"
    notes: "Formula 4 in tower-mastery.md. Solves a real structural gap: tower.md's
      tower_id is per-mission, sequential, and resets to 0 each mission (Rule 11a),
      so it cannot be used to key cross-mission-persistent mastery progress. This
      build_signature (a 4-part pipe-delimited string of the tower's full component
      loadout) is the stable key used instead for all persistent storage
      (mastery_time, unlocked_skills); tower_id is still used, unchanged, as the
      live per-mission field in the frozen mastery_progress_updated/skill_unlocked
      event payloads. Requires a NEW Tower System API this GDD depends on but does
      not implement: TowerSystem.get_component_loadout(tower_id) ->
      Dictionary[String, String] — tower_placed's current payload does not carry
      the 4-slot component loadout. Assumption flagged: component ID strings are
      assumed to never contain the '|' delimiter."
    added: 2026-07-16
    revised: ""

  - name: defense_building_tech_node_cost
    status: active
    source: design/gdd/defense-building.md
    referenced_by:
      - design/gdd/defense-building.md
    variables:
      - branch_tier
      - base_qty[rarity]
      - node_tier_multiplier
      - base_tech_gold
    output_range: [4, 45]
    expression: "material_qty = round(base_qty[rarity] × node_tier_multiplier(branch_tier)); gold_cost = round(base_tech_gold × node_tier_multiplier(branch_tier))"
    notes: "Tech node unlock cost, per rarity tier and branch_tier (1-3). base_qty
      defaults: Common=15, Uncommon=8, Rare=4. node_tier_multiplier {1.0, 1.8, 3.0} is
      a new, Defense-Building-owned constant — deliberately NOT the same as
      tower.md's tier_dps_multiplier (that scales combat power; tech cost has no
      combat referent). base_tech_gold default 50. Both tech categories
      (production_tech, structural_tech) share this one cost curve. Gates the
      5-node tech tree (tech_production_2/3/4, tech_structural_1/2) whose
      tech_unlocked events Crafting's RecipeResource.tech_prerequisite consumes."
    added: 2026-07-16
    revised: ""

  - name: defense_building_habitat_expansion_cost
    status: active
    source: design/gdd/defense-building.md
    referenced_by:
      - design/gdd/defense-building.md
      - design/gdd/menagerie.md
    variables:
      - tier
    output_range: [20, 55]
    expression: "hand-tuned table, not derived (same precedent as inventory.md's slot-expansion table): tier1=20 Common+60 gold; tier2=35 Common+12 Uncommon+120 gold; tier3=55 Common+25 Uncommon+8 Rare+200 gold"
    notes: "Satisfies menagerie.md Core Rule 4's exact contract: structure_id =
      habitat_expansion_tier_1/_tier_2/_tier_3, structure_type = literal
      'habitat_expansion' on all three tiers, emitted via sanctuary_structure_built.
      Tier 1 ungated; Tier 2 requires tech_structural_1 unlocked; Tier 3 requires
      tech_structural_2 unlocked (sequential-tier enforcement — cannot skip tiers).
      Each tier adds +2 Menagerie HABITAT slots (4->6->8->10 total), per
      menagerie.md's own already-fixed slot-count curve — this GDD only ever
      defines the cost, never the slot count, which menagerie.md owns."
    added: 2026-07-16
    revised: ""

  - name: tarot_wave_reward_scalar_final
    status: active
    source: design/gdd/tarot.md
    referenced_by:
      - design/gdd/tarot.md
      - design/gdd/wave-manager.md
    variables:
      - wave_reward_scalar_natural
      - tarot_reward_multiplier
      - rune_reward_bonus
    output_range: [1.00, 4.768]
    expression: "clamp(wave_reward_scalar_natural × tarot_reward_multiplier + rune_reward_bonus, 1.00, 4.768)"
    notes: "Formula F3 in tarot.md — extends wave-manager.md's own wave_reward_scalar
      formula (Formula 1 there) with Tarot's reward-side modifier layer, without
      introducing any new Tarot-to-Resource-Economy interface. The final value is
      forwarded unchanged through the existing monster_spawn_requested.wave_reward_scalar
      field into Monster System's monster_died payload. Hard-clamped to 4.768 —
      wave-manager.md's own natural F1 ceiling at r=0.25/wave 8 — so Tarot's reward
      layer can accelerate a mission's reward curve but never exceed the absolute
      ceiling Resource Economy's drop-rate math was calibrated against
      (WAVE_ERI_CEILING_COMBINED). tarot_reward_multiplier is itself an aggregate
      (multiplicative stacking across equipped tarot_reward_scalar_mult cards, clamped
      [0.50, 2.00] before this formula consumes it) plus rune_reward_bonus (additive,
      permanent, [0.00, 0.30], Formula F5)."
    added: 2026-07-16
    revised: ""

  - name: menagerie_quality_bonus_aggregate
    status: active
    source: design/gdd/menagerie.md
    referenced_by:
      - design/gdd/menagerie.md
      - design/gdd/resource-economy.md
    variables:
      - N_habitat
      - H_avg
    output_range: [1.0, 1.5]
    expression: "1.0 if N_habitat=0, else clamp(1.0 + 0.5 × (H_avg / 100), 1.0, 1.5)"
    notes: "The concrete formula behind the pre-existing registered constant
      menagerie_quality_bonus (source: resource-economy.md) — resource-economy.md
      only ever specified the [1.0, 1.5] range and consumption contract; this GDD is
      where the actual aggregate expression is originated. H_avg is the arithmetic
      mean happiness across only HABITAT-state creatures (RESERVE/BREEDING_PEN
      excluded per menagerie.md Rule 5). quality_bonus_coefficient=0.5 is fixed —
      changing it would push output outside the registered [1.0,1.5] bounds and
      require a coordinated revision with resource-economy.md. Menagerie pushes this
      value via creature_happiness_changed's quality_bonus field; Resource Economy
      caches, never recomputes (resource-economy.md Rule 3)."
    added: 2026-07-16
    revised: ""

  - name: constellation_bonus_value
    status: active
    source: design/gdd/constellation.md
    referenced_by:
      - design/gdd/constellation.md
    variables:
      - base_unit_bonus
      - size_growth_rate
      - N
      - N_min
      - shape_complexity_bonus
      - bonus_cap
    output_range: [0.10, 0.25]
    expression: "min(bonus_cap, base_unit_bonus × (1 + size_growth_rate × (N - N_min)) + shape_complexity_bonus)"
    notes: "Emitted as bonus_value in the constellation_activated event payload (see
      event-bus.md). Defaults: base_unit_bonus=0.10, size_growth_rate=0.35, bonus_cap=0.25,
      shape_complexity_bonus per shape (triad_line=0.00, quad_line=0.00, l_corner=0.02,
      cross_plus=0.03). Worked outputs at default tuning: triad_line=0.100, quad_line=0.135,
      l_corner=0.155, cross_plus=0.200. Deliberately capped because multiple overlapping
      pattern instances stack additively at Tower System (constellation.md Core Rule 6) —
      an uncapped per-instance value would let 2-3 overlapping patterns break tower balance
      calibrated independently in tower.md. Tower System applies bonus_type/bonus_value to
      its own stats; Constellation System does not modify Tower state directly."
    added: 2026-07-16
    revised: ""

# Example:
#
# formulas:
#   - name: damage_formula
#     status: active
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/progression.md   # progression GDD scales attack variable
#     variables:
#       - attack
#       - defense
#       - crit_chance
#       - crit_multiplier
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     notes: "Output feeds into health-system damage intake. Min is 0 (armour
#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: eventbus_frame_budget_fraction
    status: active
    source: design/gdd/event-bus.md
    referenced_by:
      - design/gdd/event-bus.md
    value: 0.10
    unit: fraction of 16.67ms frame budget
    notes: "10% of the frame budget allocated to all EventBus signal dispatch combined.
      System authors must size subscriber code to stay within the T_chain derived from
      this value. Revisit after first full-25-system profiling run."
    added: 2026-04-21
    revised: ""

  - name: eventbus_batch_threshold
    status: active
    source: design/gdd/event-bus.md
    referenced_by:
      - design/gdd/event-bus.md
    value: 20
    unit: firings per frame
    notes: "When a single event type fires more than 20 times in one physics frame,
      the emitting system must switch to batched deferred dispatch. Derived from
      Formula 2 (T_firing = T_chain / F_per_frame). Wave Manager GDD must reference
      this constant when designing the monster_died batch accumulator."
    added: 2026-04-21
    revised: ""

  - name: save_format_version
    status: active
    source: design/gdd/save-persistence.md
    referenced_by:
      - design/gdd/save-persistence.md
    value: 1
    unit: integer version number
    notes: "CURRENT_FORMAT_VERSION — the save file schema version. Every save file
      embeds this value. On load: if file version < this value, apply migration;
      if file version > this value, abort load with downgrade error. Must be
      incremented (never decremented) with every breaking save format change.
      Each increment must ship with a migration function."
    added: 2026-04-21
    revised: ""

  - name: towers_affinity_reference_count
    status: active
