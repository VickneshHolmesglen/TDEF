      of 3). Grid.get_occupied_cells_in_radius(changed_cell, this_value) bounds every
      pattern-detection recheck to a localized neighborhood instead of a full-board
      scan (constellation.md Core Rule 8, Formula 2). Must be recomputed and this
      value updated whenever a larger pattern is added to the catalogue — see
      constellation.md Open Question OQ-6."
    added: 2026-07-16
    revised: ""

