    signal_signature: "Criterion A (read/mutate query, ADR-0020) — has_items(cost: Dictionary) -> bool (pre-existing, ADR-0016); has_room_for(item_type: String, quantity: int) -> bool (read-only pre-check); has_specific_item(item_id: StringName) -> bool (added for ADR-0034 — narrowly-scoped like has_room_for(), answers 'do I own this exact item_id' rather than has_items()'s item_type/quantity sum); clear_damaged_flag(item_id: String) -> bool and apply_rune_to_item(item_id: String, rune_id: String, stat_delta: Dictionary) -> bool (both in-place mutations, do NOT check InventorySlot.locked, do NOT fire item_added/item_removed — callers must key UI refresh off component_repaired/item_rune_imbued instead); reserve_instance_id() -> int (added for ADR-0025 — mints a collision-safe instance_id from Inventory's own _next_instance_id counter before the item it belongs to is constructed, for callers like Equipment Forge's sacrifice flow that must pass an item_id to another system before creating the item)."
