# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: event-bus
    status: active
    budget_ms: 1.667
    target_fps: 60
    platform: PC
    adr: docs/architecture/adr-0001-eventbus-architecture.md
    notes: "10% of 16.67 ms frame budget. Per-event-type budget ~0.208 ms (8 concurrent event types). Batch threshold: >20 firings/frame → switch to deferred batch event."
    referenced_by:
      - docs/architecture/adr-0001-eventbus-architecture.md
    added: 2026-05-15
    revised: ""

