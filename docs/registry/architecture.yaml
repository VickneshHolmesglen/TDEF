# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_cross_system_node_reference
    status: active
    description: "A system must not hold a direct Node reference to any other system at runtime. All cross-system communication must pass through EventBus signals."
    why: "Direct references create tight coupling that breaks the game's cross-system synergy model and makes systems untestable in isolation."
    adr: docs/architecture/adr-0001-eventbus-architecture.md
    added: 2026-05-15

  - pattern: dictionary_event_payload
    status: active
    description: "EventBus signal payloads must not use untyped Dictionary. Use typed signal parameters for ≤4 fields; use a Resource subclass for ≥5 fields."
    why: "Untyped Dictionaries lose type safety, break GDScript compiler optimisations, and make signal contracts invisible to tooling and code review."
    adr: docs/architecture/adr-0001-eventbus-architecture.md
    added: 2026-05-15

  - pattern: synchronous_level1_cascade
    status: active
    description: "A subscriber that emits a further event (Level-1 cascade) must emit it deferred (call_deferred or signal.emit.call_deferred). Synchronous Level-1 cascade is forbidden."
    why: "Synchronous Level-1 cascade multiplies frame cost by (1 + D × S_avg). At peak wave volume (10+ towers firing), a single Level-1 cascade chain consumes 50% of the entire EventBus frame budget. See EventBus GDD Formula 3 and EC-8."
    adr: docs/architecture/adr-0001-eventbus-architecture.md
    added: 2026-05-15

  - pattern: direct_scene_transition
    status: active
    description: "Gameplay systems must not call SceneTree.change_scene_to_file() or change_scene_to_packed() directly. All scene transitions must go through SceneManager."
    why: "Direct scene transitions bypass SceneManager's loading screen, cleanup, and EventBus broadcast. Bypassing this creates race conditions between scene teardown and active subscriptions."
    adr: docs/architecture/adr-0002-scene-autoload-structure.md
    added: 2026-05-16

  - pattern: mid_wave_scene_transition
    status: active
    description: "SceneManager must never initiate a scene transition during WAVE_ACTIVE. Transitions are only triggered by terminal mission events (mission_complete, hero_died)."
    why: "Transitioning mid-wave leaves MonsterManager, TowerManager, and WaveManager in partially-active states with live EventBus subscriptions — guaranteed crash."
    adr: docs/architecture/adr-0002-scene-autoload-structure.md
    added: 2026-05-16

  - pattern: resource_object_in_save_data
    status: active
    description: "get_save_data() must not return Resource instances or engine types (Vector2i, Color, NodePath). All save data must be primitive GDScript types: int, float, bool, String, Array, Dictionary."
    why: "store_var(data, true) embeds Resource script paths — a file rename silently corrupts every save. store_var(data, false) drops non-primitive objects without error. Primitive-only data is independently testable."
    adr: docs/architecture/adr-0003-save-file-format.md
    added: 2026-05-16

  - pattern: unchecked_fileaccess_write
    status: active
    description: "Every FileAccess.store_32(), store_var(), store_string(), or store_buffer() call must check the returned bool. Void-return assumptions are pre-Godot-4.4 and will miss write failures silently."
    why: "Godot 4.4 changed all store_* methods from void to bool return. Unchecked writes produce no error in normal conditions but silently fail on full disk or permission errors — data loss with no player feedback."
    adr: docs/architecture/adr-0003-save-file-format.md
    added: 2026-05-16

  - pattern: per_monster_astar_during_wave
    status: active
    description: "Monster systems must not run individual A* queries during WAVE_ACTIVE. All path lookups during active waves must use PathfindingSystem.get_path() which reads pre-computed route templates. Standalone A* runs are only permitted in: (a) PathfindingSystem internal dirty rebuild (deferred, batched); (b) PathfindingSystem.would_block_all_paths() temp validation (never during WAVE_ACTIVE); (c) get_path() fallback for off-template monsters (push_warning required)."
    why: "100 monsters × per-monster A* at wave spawn or on each path_invalidated = O(monster_count × SPAWN_count) A* runs per frame event. Profiled as frame budget risk. Route templates reduce this to O(SPAWN_count) per placement event and O(1) per monster per frame."
    adr: docs/architecture/adr-0004-pathfinding-strategy.md
    added: 2026-05-16

  - pattern: would_block_all_paths_on_hover
    status: active
    description: "PathfindingSystem.would_block_all_paths() must only be called on placement confirmation (click/release), never on hover. The function builds temporary AStar2D instances — calling it at 60 FPS during cursor hover would consume the entire frame budget."
    why: "would_block_all_paths() constructs a temp walkability copy and runs A* for every SPAWN cell. At one call per frame on hover, this is ~0.05–0.1 ms × 60 = 3–6 ms/second of unnecessary CPU overhead."
    adr: docs/architecture/adr-0004-pathfinding-strategy.md
    added: 2026-05-16

  - pattern: stale_walkability_map
    status: active
    description: "Callers must not cache the return value of Grid.get_walkable_cell_map() across EventBus tower_placed or tower_removed events. Pathfinding must call get_walkable_cell_map() fresh whenever tower changes are processed."
    why: "get_walkable_cell_map() includes unoccupied PLACEABLE cells as walkable and excludes occupied ones. A cached map from before tower placement will route monsters through occupied cells — a logic correctness failure, not just a performance issue."
    adr: docs/architecture/adr-0005-grid-system-data-model.md
    added: 2026-05-16

  - pattern: grid_write_outside_tower_system
    status: active
    description: "Grid.place_tower() and Grid.remove_tower() must only be called by Tower System. No other system may write to Grid occupancy state."
    why: "Grid occupancy is the authoritative record of what is built. If multiple systems can write to it, the single-writer ownership invariant breaks — Constellation, Pathfinding, and Tower Mastery all read occupancy and must trust it is consistent. Tower System is the only system that validates placement intent and emits tower_placed/tower_removed events to notify dependents."
    adr: docs/architecture/adr-0005-grid-system-data-model.md
    added: 2026-05-16

  - pattern: shallow_duplicate_for_components
    status: active
    description: "Resource.duplicate() (shallow copy) must not be used to isolate TowerComponent Resources per placed tower instance. Resource.duplicate_deep() is required. Nested Resources inside a component (e.g. TowerPerkData inside FoundationComponent) must be Resource subclasses — non-Resource nested objects are not deep-copied and will be shared between mission instance and inventory."
    why: "Shallow duplicate() leaves nested Resources shared between the mission-instance copy and the player's inventory item. Mission-time mutations (damaged := true, perk activation) would silently corrupt inventory state. duplicate_deep() (Godot 4.5+) is the correct API and is available in 4.6.2."
    adr: docs/architecture/adr-0008-tower-placement-gate.md
    added: 2026-05-19

  - pattern: tower_mission_state_export
    status: active
    description: "TowerMissionState Resource instances must never be assigned to @export properties on Autoloads or any persistent node. Mission-instance Resources are RefCounted and must be freed automatically when the Tower System releases its reference. An @export assignment causes the Godot editor to hold a strong reference, preventing collection after tower removal."
    why: "Accidental @export of a TowerMissionState on a persistent node (e.g. an Autoload) will leak all 4 duplicate_deep() component copies for the lifetime of the editor session — effectively turning a per-tower temporary into a permanent memory leak."
    adr: docs/architecture/adr-0008-tower-placement-gate.md
    added: 2026-05-19

  - pattern: per_monster_physics_process
    status: active
    description: "MonsterEntity scene nodes (Area2D roots) must NOT define their own _physics_process. All per-entity logic — damage application, BOSS attack, movement, absorbed flush — must run inside MonsterManager._physics_process in the 4-pass centralized order. Per-entity _physics_process is forbidden because the engine calls each node's _physics_process in scene-tree order, which is not guaranteed stable, making the DEAD-priority invariant (Pass 1 before Pass 3) non-deterministic."
    why: "If MonsterEntity defines its own _physics_process, a lethal hit and GOAL arrival in the same frame may be processed in either order depending on scene-tree position. This can produce a BREACHED entity with current_hp <= 0 — an invalid state that corrupts drop resolution and wave-clear accounting. The 4-pass centralized structure is the only way to guarantee DEAD-priority structurally rather than conditionally."
    adr: docs/architecture/adr-0006-monster-movement.md
    added: 2026-05-22

  - pattern: data_resource_as_event_payload
    status: active
    description: "Persistent data Resources (MonsterResource, WaveConfig, FoundationComponent, etc.) must not be emitted as EventBus signal payloads. Event payloads use short-lived event-payload Resource subclasses (MonsterDamageTaken, HeroAutoAttackEvent, TowerWaveSummary, TowerAuraPulseEvent) which are never saved as .tres files. The two categories are distinct and must not be mixed."
    why: "Emitting a data Resource as an event payload risks subscribers holding references that prevent GC, or mutating shared read-only data. Event-payload Resources are designed to be short-lived and fire-and-forget; data Resources are designed to be loaded once and shared immutably. Conflating them creates ownership ambiguity — which system can free the Resource? When?"
    adr: docs/architecture/adr-0009-resource-data-model.md
    added: 2026-05-23

  - pattern: synchronous_damage_application
    status: active
    description: "D&S must not emit monster_damage_taken synchronously from within a tower_attacked or hero_auto_attacked subscriber. All damage events that feed Monster System HP application must be deferred exactly one frame via 'await get_tree().process_frame'. Similarly, any future async EventBus subscriber must use this pattern rather than call_deferred or synchronous emission."
    why: "Synchronous emit creates a Level-1 cascade from tower_attacked at tower-attack volume (up to 20+/frame during WAVE_ACTIVE). Chained to MonsterManager's Pass 4 emission of monster_hp_absorbed, this produces a 3-level synchronous chain exceeding the ADR-0001 cascade limit (max 2 levels). call_deferred is also rejected: it schedules at end-of-current-frame and does not guarantee delivery in the next frame's _physics_process Pass 1 drain."
    adr: docs/architecture/adr-0007-damage-pipeline.md
    added: 2026-05-23

  - pattern: direct_phase_assignment
    status: active
    description: "WaveManager._phase must not be assigned directly from any method other than _transition_to(new_phase). All FSM state transitions must go through _transition_to(), which enforces the _phase_locked check, stops current-phase timers, emits mission_phase_changed, and calls the phase entry method."
    why: "Direct _phase assignment bypasses three invariants simultaneously: (1) _phase_locked check that enforces DEFEAT priority, (2) timer cancellation for the exiting phase, (3) mission_phase_changed EventBus emission that all downstream systems (Mission HUD, Constellation, Save) depend on for phase tracking. A single unguarded assignment can leave timers running, subscribers desynced, and DEFEAT suppressible."
    adr: docs/architecture/adr-0012-wave-manager-fsm.md
    added: 2026-05-24

  - pattern: hero_queries_tower_system_directly
    status: active
    description: "Hero System must not hold a direct reference to Tower System, call any Tower System method, or read Tower System internal state. All tower data required by Hero System (archetype, cell) must arrive exclusively via EventBus subscriptions (tower_placed, tower_removed, tower_destroyed) into a local _tower_cache Dictionary."
    why: "Tower System is not an Autoload — Hero System is. A direct reference from an Autoload to a scene-instanced system creates a boot-order dependency that cannot be resolved without changing Autoload order, and a lifecycle dependency that crashes if the mission scene is freed while the Hero Autoload holds a reference. The EventBus tower cache pattern (identical to D&S monster cache in ADR-0007) resolves both issues."
    adr: docs/architecture/adr-0010-hero-tower-synced-class.md
    added: 2026-05-24

