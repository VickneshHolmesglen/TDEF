      - monster-system
    adr: docs/architecture/adr-0005-grid-system-data-model.md
    signal_signature: "Direct Autoload call (e.g. Grid.get_cell_type(cell)). Documented exception to EventBus-only rule — per-frame spatial queries cannot route through EventBus without exceeding frame budget. All read functions return copies, never references. Write calls (place_tower, remove_tower) restricted to Tower System."
    referenced_by:
      - docs/architecture/adr-0005-grid-system-data-model.md
    added: 2026-05-16
    revised: ""

  - contract: tower_placement_gate
    status: active
