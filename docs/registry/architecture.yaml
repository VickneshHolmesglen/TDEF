# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: cross_system_dispatch
    status: active
    api: "GDScript typed signals on EventBus Autoload (signal.connect(callable), signal.emit(...))"
    not: "Direct node-to-node signal connections; untyped Dictionary payloads; message queue"
    adr: docs/architecture/adr-0001-eventbus-architecture.md
    reason: "Single pub/sub backbone enables cross-system synergies without direct dependencies. Godot signal system is C++ backed, zero overhead when no subscribers. The event catalogue (74 events as of 2026-07-13) is the single source of truth for all cross-system communication."
    referenced_by:
      - docs/architecture/adr-0001-eventbus-architecture.md
    added: 2026-05-15
    revised: ""

  - purpose: pathfinding_computation
    status: active
    api: "AStar2D (GDScript subclass overriding _estimate_cost()). One instance per SPAWN cell. get_id_path() for route computation. Shared route templates with cell_index_map for O(1) monster path lookup."
    not: "NavigationServer2D / NavigationAgent2D (post-cutoff API risk, continuous-space mismatch); per-monster A* queries during WAVE_ACTIVE; flow fields (over-engineered for 100-monster MVP scope)"
    adr: docs/architecture/adr-0004-pathfinding-strategy.md
    reason: "AStar2D is a stable pre-4.x API (unchanged through 4.6). Shared route templates reduce per-placement A* from O(monster_count) to O(SPAWN_count). NavigationServer2D had breaking changes in Godot 4.0 and 4.2 — avoidance decision made explicitly due to post-cutoff API risk."
    referenced_by:
      - docs/architecture/adr-0004-pathfinding-strategy.md
    added: 2026-05-16
    revised: ""

  - purpose: tower_component_isolation
    status: active
    api: "Resource.duplicate_deep() called on each of the 4 component Resources (Foundation, Weapon, Focus, Power) at place_tower() commit. Stored in TowerMissionState keyed by tower_id."
    not: "Resource.duplicate() (shallow — leaves nested Resources shared); manual recursive copy functions; serialise/deserialise round-trip at placement"
    adr: docs/architecture/adr-0008-tower-placement-gate.md
    reason: "duplicate_deep() (Godot 4.5+) handles the full Resource tree automatically. Shallow duplicate() is deprecated for nested Resources since 4.5. Mission-instance isolation prevents mid-mission mutations from corrupting inventory data."
    referenced_by:
      - docs/architecture/adr-0008-tower-placement-gate.md
    added: 2026-05-19
    revised: ""

  - purpose: save_file_serialisation
    status: active
    api: "FileAccess.store_32(CURRENT_FORMAT_VERSION) + FileAccess.store_var(data, false). Atomic write via DirAccess.rename(.tmp → .dat)."
    not: "JSON (JSON.stringify/parse_string); ConfigFile; store_var(data, true) — full_objects=true embeds Resource script paths that break on file rename; custom binary packing"
    adr: docs/architecture/adr-0003-save-file-format.md
    reason: "store_var() handles nested Dictionaries/Arrays natively with no per-field serialiser boilerplate. 4-byte store_32 version header enables migration before game data is parsed. full_objects=false prevents script-path embedding. Atomic rename prevents half-written save corruption."
    referenced_by:
      - docs/architecture/adr-0003-save-file-format.md
    added: 2026-05-16
    revised: ""

  - purpose: wave_manager_fsm_implementation
    status: active
    api: "GDScript enum Phase (7 members) + match statement; 5 scene-tree Timer nodes (one_shot=true) with named timeout callbacks; single _transition_to(new_phase) entry point for all transitions; GDScript coroutine _run_spawn_sequence() with _spawn_active bool cancellation flag."
    not: "State class hierarchy per phase (GDScript coroutines cannot span class boundaries); _process(delta) timer accumulation (cannot inject timer expiry in unit tests); AnimationTree / StateMachine node (designed for animations, not game logic FSMs)"
    adr: docs/architecture/adr-0012-wave-manager-fsm.md
    reason: "Timer nodes are directly testable via callback invocation without Engine.time_scale (required by wave-manager.md AC timer mocking constraint). enum+match maps 1:1 to GDD's 7 states. Single _transition_to() entry point enforces timer-stop and signal-emit invariants on every transition."
    referenced_by:
      - docs/architecture/adr-0012-wave-manager-fsm.md
    added: 2026-05-24
    revised: ""

  - purpose: hero_proximity_distance_metric
    status: active
    api: "Chebyshev distance computed inline: maxi(abs(hero_cell.x - tower_cell.x), abs(hero_cell.y - tower_cell.y)). No Grid API extension. No Vector2i helper method."
    not: "Grid.get_towers_in_range() extension (Grid scope is spatial queries for placement/pathfinding, not hero proximity); Vector2i distance methods; Euclidean distance (GDD specifies Chebyshev)"
    adr: docs/architecture/adr-0010-hero-tower-synced-class.md
    reason: "Grid API is restricted to Tower System writes and spatial queries needed by Pathfinding and Placement. Adding a hero-proximity query to Grid would expand its scope beyond ADR-0005 definition. Inline Chebyshev is 2 integer operations — no helper needed."
    referenced_by:
      - docs/architecture/adr-0010-hero-tower-synced-class.md
    added: 2026-05-24
    revised: ""

  - purpose: drop_table_data_model
    status: active
    api: "DropTableResource/DropEntry Resource subclasses loaded via GameDataRegistry at boot (Autoload position 5), each implementing validate() -> Array[String] per the resource_validation contract."
    not: "Plain Dictionary-based drop tables (no Resource subclass, no GameDataRegistry integration); folding drop-table fields directly into MonsterResource (couples an already-Approved, already-implemented schema to Resource Economy's concerns and breaks content reuse across monster types sharing one table)"
    adr: docs/architecture/adr-0017-resource-economy-drop-resolution.md
    reason: "Mirrors ADR-0016's ItemDefinitionResource and ADR-0009's MonsterResource pattern — the project's established data-driven-Resource convention. MonsterResource.drop_table_id is already an indirection (StringName reference, not inline data) per monster.md, so a separate shared DropTableResource honors that existing field design rather than collapsing it."
    referenced_by:
      - docs/architecture/adr-0017-resource-economy-drop-resolution.md
    added: 2026-07-11
    revised: ""

  - purpose: unique_instance_isolation
    status: active
    api: "Dictionary.duplicate(true) (deep dictionary copy) applied to InventorySlot.stat_overrides at equip/install time."
    not: "Resource.duplicate_deep() — reserved for actual Resource-to-Resource reference graphs (e.g. TowerComponent per ADR-0008); stat_overrides is a flat primitive Dictionary with no nested Resources, so the heavier Resource-tree API is unnecessary overhead"
    adr: docs/architecture/adr-0016-inventory-storage-model.md
    reason: "InventorySlot is a plain RefCounted, not a Resource — duplicate_deep() doesn't apply to it at all. Dictionary.duplicate(true) correctly deep-copies the flat primitive stat_overrides Dictionary, confirmed idiomatic by godot-specialist validation during ADR authoring."
    referenced_by:
      - docs/architecture/adr-0016-inventory-storage-model.md
    added: 2026-07-11
    revised: ""

  - purpose: projectile_pooling
    status: active
    api: "Fixed-size pool (192) of pre-instantiated plain Node2D Projectile instances, warmed up once at mission start. Release/reuse toggles visible = false + process_mode = Node.PROCESS_MODE_DISABLED (both required — visible alone does not stop a child AnimatedSprite2D's internal animation timer from advancing)."
    not: "Area2D-based Projectile (no physical overlap detection needed — arrival/re-acquisition is cache/ID-driven against TowerSystem._monster_cache, not spatial); instantiate()/queue_free() per shot (violates zero-allocation-hot-path rule, explicitly ruled out by tower.md's own pool-sizing tuning knobs); PROCESS_MODE_PAUSABLE (reacts to SceneTree.paused, irrelevant to pool release)."
    adr: docs/architecture/adr-0019-projectile-pooling-strategy.md
    reason: "tower.md's tuning knobs (projectile_pool_size, max_reacquisitions_per_frame) presuppose a fixed-size pool. Cache/ID-driven re-acquisition (bounded to the firing tower's range/cone) makes Area2D unnecessary overhead. Confirmed idiomatic by godot-specialist validation during ADR authoring."
    referenced_by:
      - docs/architecture/adr-0019-projectile-pooling-strategy.md
    added: 2026-07-13
    revised: ""

  - purpose: constellation_pattern_detection
    status: active
    api: "Incremental, event-driven data structures: Dictionary[String, ConstellationInstance] active-instance table (keyed pattern_id) + Dictionary[int, Array[String]] reverse index (tower_id -> pattern_ids) + Dictionary[int, String] per-tower tag cache, all Constellation-internal RefCounted/Dictionary state. Detection per tower_placed/tower_removed/tower_destroyed calls Grid.get_occupied_cells_in_radius(changed_cell, pattern_search_radius) exactly once per event."
    not: "Full-board rescan (Grid.get_all_occupied_cells()) on every event — explicitly forbidden by constellation.md Core Rule 8/AC-17; storing pattern membership on Tower System's TowerMissionState instead of a Constellation-owned reverse index — would violate ADR-0008's tower-system-only write access to tower_mission_state."
    adr: docs/architecture/adr-0022-constellation-pattern-detection.md
    reason: "Per-event detection cost must not scale with total tower count (constellation.md AC-30) — an incremental reverse-index lookup for deactivation and a radius-bounded Grid query for activation both satisfy this by construction, unlike a full rescan."
    referenced_by:
      - docs/architecture/adr-0022-constellation-pattern-detection.md
    added: 2026-07-17
    revised: ""

  - purpose: recipe_data_model
    status: active
    api: "RecipeResource Resource subclass, GameDataRegistry-backed at boot (Autoload position 5), validated via validate() -> Array[String] per the resource_validation contract (ADR-0009). Discovery tracked via a Crafting-owned Dictionary[StringName, bool] Discovery Ledger (SaveRestorer, ADR-0003), checked from 3 trigger paths: tech_unlocked, item_added, and a one-time boot/restore-time sweep in restore_save_data()."
    not: "Flat Dictionary/JSON recipe catalogue with no GameDataRegistry integration (breaks from the project's established Resource-subclass convention); modeling Repair as a RecipeResource instance (Repair has no recipe_id, never fires recipe_discovered, and is gated on InventorySlot.damaged directly — ADR-0021)."
    adr: docs/architecture/adr-0023-crafting-recipe-data-model.md
    reason: "Mirrors ADR-0009's MonsterResource/WaveConfig pattern and ADR-0016's ItemDefinitionResource extension of it — the project's established data-driven-Resource convention. The 3rd discovery trigger (boot sweep) resolves a confirmed qa-lead-flagged implementability gap (TR-craft-002) where Rule 4's original 2 triggers left AC-1 unimplementable."
    referenced_by:
      - docs/architecture/adr-0023-crafting-recipe-data-model.md
    added: 2026-07-17
    revised: ""

  - purpose: tech_tree_and_structure_data_model
    status: active
    api: "Two parallel Resource subclasses (TechNodeResource, StructureResource), both GameDataRegistry-backed at boot, following ADR-0009's convention. Two independent Dictionary[StringName, bool] ledgers (terminal state only — LOCKED_PREREQ/AVAILABLE derived at query time, never persisted), one shared _action_resolving guard across both ledgers."
    not: "A single unified 'progression point' currency spanning both ledgers (explicitly forbidden by defense-building.md Core Rule 1); persisting the full 3-state (LOCKED_PREREQ/AVAILABLE/UNLOCKED) per entry (would require re-deriving AVAILABLE on load anyway since it depends on live affordability, making the persisted value a stale-data risk)."
    adr: docs/architecture/adr-0024-defense-building-tech-tree-data-model.md
    reason: "Mirrors ADR-0023's RecipeResource/Discovery-Ledger pattern exactly — the project's established shape for permanent-unlock content gated by prerequisite chains. Deriving locked/available state from one terminal-state source of truth eliminates a 3-state-consistency class of bug entirely."
    referenced_by:
      - docs/architecture/adr-0024-defense-building-tech-tree-data-model.md
    added: 2026-07-17
    revised: ""

  - purpose: equipment_forge_data_model
    status: active
    api: "Two Resource subclasses (EquipmentRecipeResource, SacrificeRecipeResource), GameDataRegistry-backed, mirroring (not subclassing) RecipeResource's field shape and validation convention (ADR-0023). Two persisted Dictionary ledgers (Equipment Recipe Discovery, Available Runes); a third conceptual state (per-item rune slot occupancy) deliberately NOT owned here — it's InventorySlot.imbued_runes (ADR-0021). One shared _forge_resolving guard across 3 distinct operation types (craft, imbue, sacrifice)."
    not: "A single polymorphic RuneSourceResource unifying Constellation/Tarot/Menagerie acquisition (would force Menagerie's atomic consume-on-create into a ledger-write-then-immediate-read pattern it doesn't need, per equipment-forge.md Rule 13's deliberate asymmetry); Equipment Forge itself becoming an Autoload (nothing calls into it directly — only Inventory and, pending Menagerie's ADR, Menagerie need Autoload status as callees, not Equipment Forge as caller)."
    adr: docs/architecture/adr-0025-equipment-forge-cross-system-aggregation.md
    reason: "Mirrors ADR-0023's RecipeResource/Discovery-Ledger/resolving-guard pattern, extended to 2 recipe schemas and 3 operation types instead of 1. The Menagerie-sourced-rune exclusion is enforced at the data-structure level (never written to available_runes) rather than left as a convention, closing equipment-forge.md's own explicitly-flagged asymmetry risk."
    referenced_by:
      - docs/architecture/adr-0025-equipment-forge-cross-system-aggregation.md
    added: 2026-07-17
    revised: ""

  - purpose: menagerie_creature_data_model
    status: active
    api: "CreatureInstance as plain RefCounted (not Resource — mirrors ADR-0016's InventorySlot precedent for flat-primitive runtime entities), Array[CreatureInstance] on the Menagerie Autoload. Fixed-size Array[BreedingPen] (2 pens, not Dictionary-keyed, since pen count is fixed and small per menagerie.md Rule 12). Minimal SpeciesResource (GameDataRegistry-backed) for the 5-species roster's tier data only. Single _recompute_and_push_aggregate() call site for Rule 6's aggregate push, invoked from all 4 HABITAT-composition-changing call sites."
    not: "CreatureInstance as a Resource with duplicate_deep() (no nested Resource references exist on this entity — same rejection reasoning ADR-0016 already established for InventorySlot's Alternative C); Dictionary-keyed breeding pens (pen count is fixed at 2, never expandable, per Rule 12 — array indexing is simpler); a Menagerie.request_sacrifice() implemented as an EventBus request/response pair (Equipment Forge's Rule 19 resolution flow requires the validation result synchronously in the same call stack — see ADR-0026 Alternative B)."
    adr: docs/architecture/adr-0026-menagerie-creature-lifecycle.md
    reason: "Mirrors ADR-0016's RefCounted-entity precedent and ADR-0022/0023's single-call-site-for-cross-cutting-invariant pattern (Constellation's reverse-index scrub, Crafting's guard flag). The single aggregate-push call site directly targets menagerie.md's own 'highest-risk rule' framing for Rule 6."
    referenced_by:
      - docs/architecture/adr-0026-menagerie-creature-lifecycle.md
    added: 2026-07-17
    revised: ""

  - purpose: tarot_static_runtime_split
    status: active
    api: "TarotCardResource (static, GameDataRegistry-backed, immutable) split from TarotProgressLedger (runtime, 3 typed Dictionaries on the Tarot node) — resolves an inconsistency in tarot.md's own Rule 1, which listed mastery_tier/mastery_missions_played/unlocked as fields directly on the Resource. Single _resolve_scout_modifiers() call site performs F1 mastery scaling at emission time; F2-stage aggregation/clamping is explicitly NOT Tarot's responsibility — Wave Manager and Monster System each aggregate their own consumed modifier_type independently."
    not: "Mutable per-instance TarotCardResource (would violate ADR-0003's resource_object_in_save_data forbidden pattern the moment mastery/discovery state needs to persist); mastery_tier stored independently of mastery_missions_played (would reintroduce the tier-desync risk tarot.md's own Rule 11 explicitly rules out); Tarot performing F2 aggregation itself (contradicts tarot.md's own Interactions table, which names Monster System/Wave Manager as the aggregating subscribers)."
    adr: docs/architecture/adr-0027-tarot-modifier-aggregation-pipeline.md
    reason: "Mirrors ADR-0016's ItemDefinitionResource/InventorySlot split and ADR-0023's RecipeResource/Discovery-Ledger split — the project's established resolution for 'GDD describes a Resource with mutable per-instance state' tension. Scope boundary (Tarot=F1 only, not F2) prevents future duplicate/conflicting aggregation logic between Tarot and its consumers."
    referenced_by:
      - docs/architecture/adr-0027-tarot-modifier-aggregation-pipeline.md
    added: 2026-07-17
    revised: ""

  - purpose: mission_select_static_runtime_split
    status: active
    api: "MissionEntry (static, GameDataRegistry-backed) split from CompletionLedger (runtime, Dictionary[String, Dictionary]) — resolves the same class of GDD-level inconsistency ADR-0027 fixed for Tarot (mission-select.md's Rule 1 listed completion_records directly on the shared Resource). MissionRuntimeState (4 scalar/reference fields, NOT a wrapped class) held directly on the MissionSelect Autoload, explicitly excluded from get_save_data() (Rule 10: never persisted). GridConfig same-instance guarantee satisfied via GDScript's default reference semantics (no .duplicate() call), not an explicit copy-prevention mechanism."
    not: "completion_records as a mutable field on MissionEntry (violates ADR-0003's resource_object_in_save_data pattern once persisted); MissionRuntimeState surviving scene transitions via a SceneManager-forwarded parameter while keeping Mission Select scene-instanced (couples SceneManager to Mission-Select-specific data shape for no benefit — ADR-0028 Alternative A); retry_current_mission() as an EventBus request/response pair (doesn't resolve the scene-transition survival problem, which exists independently of how retry is triggered — ADR-0028 Alternative B)."
    adr: docs/architecture/adr-0028-mission-select-runtime-state.md
    reason: "Mirrors ADR-0027's Tarot fix and ADR-0016/0023's earlier instances of the same static/runtime split. Mission Select's Autoload reclassification is the first in this session driven primarily by scene-transition state survival rather than solely a direct-call requirement, though both apply here."
    referenced_by:
      - docs/architecture/adr-0028-mission-select-runtime-state.md
    added: 2026-07-17
    revised: ""

  - purpose: tower_component_loadout_query
    status: active
    api: "tower_placed (already a Resource subclass) extended with 4 new loadout fields; tower_component_equipped PROMOTED from 3 bare typed params to a 7-field Resource subclass (TowerComponentEquippedEvent), carrying the tower's complete current 4-slot loadout (not just the changed slot), per event-bus.md Core Rule 4's 5+-field threshold."
    not: "TowerSystem.get_component_loadout(tower_id) as a new direct-call API (would require reclassifying Tower System as Autoload, reopening the Accepted ADR-0008's tower_mission_state privacy boundary — a materially higher-cost fix for the same problem)."
    adr: docs/architecture/adr-0029-tower-mastery-proximity-detection.md
    reason: "Mirrors ADR-0022's resolution of the structurally identical gap for Constellation (constellation_eligibility_tag added to event payloads instead of a new Tower System query API). Confirmed by godot-specialist review that ADR-0008's reasoning genuinely would be reopened by the Autoload alternative, making the event-payload extension the lower-cost fix."
    referenced_by:
      - docs/architecture/adr-0029-tower-mastery-proximity-detection.md
    added: 2026-07-17
    revised: ""

  - purpose: hero_skill_build_ultimate_derivation
    status: active
    api: "Pure-function pipeline (category_profile -> classify_shape -> derive_ultimate_id) recomputed fresh on every active-slot change, never a persisted/cached lookup table. Shared SkillDefinitionResource (amended in ADR-0029) between Tower Mastery and Hero Skill Build — one Resource, two consumers, one canonical assets/data/skills/ path."
    not: "A stored/persisted ultimate_id value (Alternative B — a content patch changing category values could silently desync a stored Ultimate from what current slots would actually produce); a separate HeroSkillDefinitionResource duplicating Tower Mastery's catalogue (Alternative A — contradicts hero-skill-build.md's own explicit single-Resource intent)."
    adr: docs/architecture/adr-0030-hero-skill-build-ultimate-lookup.md
    reason: "The pure-function shape is what makes the GDD's own risk-mitigation claim (catalogue growth never grows the Ultimate matrix) durable in code, not just true in the design doc — there's no lookup table to forget to update."
    referenced_by:
      - docs/architecture/adr-0030-hero-skill-build-ultimate-lookup.md
    added: 2026-07-17
    revised: ""

  - purpose: mission_hud_planning_cluster_lifecycle
    status: active
    api: "Planning Cluster is a separate PackedScene (planning_cluster.tscn), re-instantiated fresh on every SCOUT/INTERMISSION entry and torn down on every WAVE_ACTIVE entry. Teardown sequence is synchronous remove_child() first (forces immediate _exit_tree()/subscription disconnect), then queue_free() to actually free memory — NOT queue_free() alone, which defers node removal to end-of-frame and leaves EventBus subscriptions live/double-connected against a freshly-instantiated replacement for the rest of that frame."
    not: "A single persistent PlanningCluster node toggled visible/invisible per phase (Alternative A, rejected) — Godot 4.6.2 does not re-fire _ready() on remove_child()/add_child() of an already-initialized node (live-MCP-verified 2026-07-14, mission-hud.md Rule 6), so a persistent instance's EventBus subscriptions would silently stop reconnecting after the first wave cycle. Also not: queue_free() alone as the teardown step (would-have-been first draft of this ADR, corrected by engine-specialist review) — leaves two Planning Cluster instances simultaneously subscribed during the deferred-delete window."
    adr: docs/architecture/adr-0031-mission-hud-architecture.md
    reason: "Only synchronous remove_child()-then-queue_free() plus fresh instantiate() guarantees exactly one Planning Cluster instance's subscriptions are ever live at a time, on every wave cycle — required because path_invalidated/tower_placement_blocked handlers double-firing would cause visibly duplicated route-preview renders."
    referenced_by:
      - docs/architecture/adr-0031-mission-hud-architecture.md
    added: 2026-07-19
    revised: ""

