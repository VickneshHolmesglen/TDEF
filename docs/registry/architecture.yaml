# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: cross_system_communication
    status: active
    pattern: event_bus
    producer: any-system
    consumers:
      - any-system
    adr: docs/architecture/adr-0001-eventbus-architecture.md
    signal_signature: "Varies per event — see design/gdd/event-bus.md for full 70-event catalogue. Typed params for ≤4 fields; Resource subclass for ≥5 fields."
    referenced_by:
      - docs/architecture/adr-0001-eventbus-architecture.md
    added: 2026-05-15
    revised: ""

  - contract: scene_transition
    status: active
    pattern: direct_call
    producer: scene-manager
    consumers:
      - sanctuary-scene
      - mission-scene
    adr: docs/architecture/adr-0002-scene-autoload-structure.md
    signal_signature: "SceneManager.transition_to_mission(mission_id: String) / SceneManager.transition_to_sanctuary(). Callers must not call SceneTree.change_scene_to_file() directly."
    referenced_by:
      - docs/architecture/adr-0002-scene-autoload-structure.md
    added: 2026-05-16
    revised: ""

  - contract: grid_spatial_query
    status: active
    pattern: direct_call
    producer: grid
    consumers:
      - tower-system
      - constellation-system
      - pathfinding-system
      - wave-manager
      - tower-mastery-system
      - monster-system
    adr: docs/architecture/adr-0005-grid-system-data-model.md
    signal_signature: "Direct Autoload call (e.g. Grid.get_cell_type(cell)). Documented exception to EventBus-only rule — per-frame spatial queries cannot route through EventBus without exceeding frame budget. All read functions return copies, never references. Write calls (place_tower, remove_tower) restricted to Tower System."
    referenced_by:
      - docs/architecture/adr-0005-grid-system-data-model.md
    added: 2026-05-16
    revised: ""

  - contract: tower_placement_gate
    status: active
    pattern: direct_call
    producer: tower-system
    consumers:
      - mission-hud
      - input-handler
    adr: docs/architecture/adr-0008-tower-placement-gate.md
    signal_signature: "TowerSystem.place_tower(tower_id: String, top_left: Vector2i) -> bool. Returns false for any of: WAVE_ACTIVE, insufficient resources, footprint blocked, path blocked. Callers must not pre-check placement validity — react to the bool return only."
    referenced_by:
      - docs/architecture/adr-0008-tower-placement-gate.md
    added: 2026-05-19
    revised: ""

  - contract: tower_placement_preview
    status: active
    pattern: direct_call
    producer: tower-system
    consumers:
      - mission-hud
    adr: docs/architecture/adr-0008-tower-placement-gate.md
    signal_signature: "TowerSystem.get_placement_preview(tower_id: String, top_left: Vector2i) -> PlacementPreview. Runs Gate 1+2+3 only — never Gate 4 (path check). Returns PlacementPreview { valid: bool, reason: PlacementBlockReason }. PATH_BLOCKED is never set by this function."
    referenced_by:
      - docs/architecture/adr-0008-tower-placement-gate.md
    added: 2026-05-19
    revised: ""

  - contract: monster_processing_order
    status: active
    pattern: none
    producer: monster-manager
    consumers:
      - monster-manager
    adr: docs/architecture/adr-0006-monster-movement.md
    signal_signature: "MonsterManager._physics_process(delta) executes four sequential passes in fixed order: (1) damage pass — drain _pending_damage, apply to current_hp, mark DEAD; (2) BOSS logic pass — scan throttle, attack-prime, cooldown; (3) movement pass — advance ACTIVE entities, breach detection, rebuild active_monsters via filter(); (4) absorbed flush — emit monster_hp_absorbed per entity, clear _pending_absorbed. MonsterEntity nodes MUST NOT define their own _physics_process. This ordering is an architecture invariant — DEAD-priority over BREACHED depends on Pass 1 always preceding Pass 3."
    referenced_by:
      - docs/architecture/adr-0006-monster-movement.md
    added: 2026-05-22
    revised: ""

  - contract: resource_validation
    status: active
    pattern: none
    producer: any-data-resource
    consumers:
      - game-data-registry
      - wave-manager
      - save-persistence
    adr: docs/architecture/adr-0009-resource-data-model.md
    signal_signature: "Every persistent data Resource subclass (MonsterResource, WaveConfig, WaveScript, WaveSpawnEntry, FoundationComponent, WeaponComponent, FocusComponent, PowerComponent, TowerPerkRegistry) must implement validate() -> Array[String]. Empty array = valid. GameDataRegistry calls validate() on each MonsterResource and TowerPerkRegistry at boot. Wave Manager calls validate() on WaveConfig at mission load. Save & Persistence calls validate() on each TowerComponent at inventory load. push_error() per error string — does not abort the game in release builds. Event-payload Resources (MonsterDamageTaken, HeroAutoAttackEvent, TowerWaveSummary, TowerAuraPulseEvent) are exempt — they are never loaded from .tres files."
    referenced_by:
      - docs/architecture/adr-0009-resource-data-model.md
    added: 2026-05-23
    revised: ""

  - contract: deferred_damage_dispatch
    status: active
    pattern: event_bus
    producer: damage-status
    consumers:
      - monster-manager
      - hero-system
    adr: docs/architecture/adr-0007-damage-pipeline.md
    signal_signature: "All damage events that feed Monster System or Hero System via HP application are deferred exactly one frame using 'await get_tree().process_frame' (not call_deferred). The guard 'if not is_instance_valid(self): return' must be the first statement after every await. monster_damage_taken carries a MonsterDamageTaken Resource subclass (5 fields). hero_healed(amount: int) and hero_damage_taken(amount: int, source_type: int) use typed params. Any future async EventBus subscriber in the project must follow the same await + is_instance_valid pattern."
    referenced_by:
      - docs/architecture/adr-0007-damage-pipeline.md
    added: 2026-05-23
    revised: ""

  - contract: hero_class_unlock_notification
    status: active
    pattern: event_bus
    producer: hero-system
    consumers:
      - mission-hud
      - constellation-system
      - save-persistence
    adr: docs/architecture/adr-0010-hero-tower-synced-class.md
    signal_signature: "hero_class_unlocked(archetype: StringName, is_deep: bool). Emitted by HeroSystem when proximity_time[archetype] crosses CLASS_UNLOCK_THRESHOLD_S (30 s, is_deep=false) or CLASS_DEEP_UNLOCK_THRESHOLD_S (90 s, is_deep=true). Each threshold fires exactly once per archetype per mission. NOTE: this signal is not yet in the event-bus.md EventBus catalogue — must be added before Hero System implementation begins."
    referenced_by:
      - docs/architecture/adr-0010-hero-tower-synced-class.md
    added: 2026-05-24
    revised: ""

