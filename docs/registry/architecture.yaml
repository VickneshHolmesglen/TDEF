    adr: docs/architecture/adr-0010-hero-tower-synced-class.md
    signal_signature: "hero_class_unlocked(archetype: StringName, is_deep: bool). Emitted by HeroSystem when proximity_time[archetype] crosses CLASS_UNLOCK_THRESHOLD_S (30 s, is_deep=false) or CLASS_DEEP_UNLOCK_THRESHOLD_S (90 s, is_deep=true). Each threshold fires exactly once per archetype per mission. NOTE: this signal is not yet in the event-bus.md EventBus catalogue — must be added before Hero System implementation begins."
    referenced_by:
      - docs/architecture/adr-0010-hero-tower-synced-class.md
    added: 2026-05-24
    revised: ""

  - contract: ui_input_mode_tracking
    status: active
    pattern: none
    producer: input-mode-tracker
    consumers:
      - inventory-ui
    adr: docs/architecture/adr-0011-ui-dual-focus-handling.md
    signal_signature: "InputModeTracker (src/ui/input_mode_tracker.gd) — a reusable, NON-Autoload Node instanced as a child of each interactive UI screen (Godot 4.6 split mouse focus from keyboard/gamepad focus; grab_focus() only ever moves the latter). Detects mode via _input(event): InputEventMouseMotion/MouseButton -> MOUSE; InputEventKey/JoypadButton/JoypadMotion -> KEYBOARD_GAMEPAD (uses _input, not _unhandled_input, so Controls with mouse_filter=STOP don't swallow the detection event). Emits input_mode_changed(mode) only when mode actually changes. Exposes is_focus_ring_visible() -> bool (true iff mode == KEYBOARD_GAMEPAD). Consumer contract: any focusable widget on a tracked screen must gate its focus-ring visual on has_focus() AND tracker.is_focus_ring_visible() — mouse hover remains a fully separate visual driven by mouse_entered/mouse_exited, never merged into one 'highlighted' state. focus_neighbor_* must be wired explicitly per grid (not left to automatic traversal) wherever tab-wrap-at-edge or similar custom adjacency is required."
    referenced_by:
      - docs/architecture/adr-0011-ui-dual-focus-handling.md
      - docs/architecture/adr-0010-hero-tower-synced-class.md   # original (corrected) reference to this ADR
    added: 2026-07-13
    revised: ""

  - contract: mission_retry_action
    status: active   # confirmed implementable by ADR-0028 — Mission Select reclassified Autoload #12
    pattern: direct_call
    producer: mission-select
    consumers:
      - mission-hud
    adr: docs/architecture/adr-0028-mission-select-runtime-state.md
    signal_signature: "MissionSelect.retry_current_mission() -> void — Criterion B (narrow single-caller UI action, ADR-0020). Called only by Mission HUD's DEFEAT Retry button (a MissionScene child) — no other caller exists by design. Guarded by an explicit MissionRuntimeState-presence check; logs and no-ops if absent (mission-select.md Rule 10/EC-6). Re-delivers the exact cached GridConfig instance to Grid.initialize() (same reference, never duplicated) then re-emits mission_launched with the cached values. Mission Select is Autoload #12 — required both for this call's Criterion-B callability AND because MissionRuntimeState must survive the SANCTUARY->MISSION scene transition (ADR-0028)."
    referenced_by:
      - docs/architecture/adr-0020-direct-autoload-call-exception-pattern.md
      - docs/architecture/adr-0028-mission-select-runtime-state.md
    added: 2026-07-17
    revised: "2026-07-17 — ADR-0028 confirmed Mission Select as Autoload #12, resolving implementability"

