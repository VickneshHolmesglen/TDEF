    adr: docs/architecture/adr-0008-tower-placement-gate.md
    signal_signature: "TowerSystem.place_tower(tower_id: String, top_left: Vector2i) -> bool. Returns false for any of: WAVE_ACTIVE, insufficient resources, footprint blocked, path blocked. Callers must not pre-check placement validity — react to the bool return only."
    referenced_by:
      - docs/architecture/adr-0008-tower-placement-gate.md
    added: 2026-05-19
    revised: ""

