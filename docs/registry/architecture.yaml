# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: cross_system_communication
    status: active
    pattern: event_bus
    producer: any-system
    consumers:
      - any-system
    adr: docs/architecture/adr-0001-eventbus-architecture.md
    signal_signature: "Varies per event — see design/gdd/event-bus.md for the full catalogue (74 events as of 2026-07-13). Typed params for ≤4 fields; Resource subclass for ≥5 fields."
    referenced_by:
      - docs/architecture/adr-0001-eventbus-architecture.md
    added: 2026-05-15
    revised: ""

  - contract: scene_transition
    status: active
    pattern: direct_call
    producer: scene-manager
    consumers:
      - sanctuary-scene
      - mission-scene
    adr: docs/architecture/adr-0002-scene-autoload-structure.md
    signal_signature: "SceneManager.transition_to_mission(mission_id: String) / SceneManager.transition_to_sanctuary(). Callers must not call SceneTree.change_scene_to_file() directly."
    referenced_by:
      - docs/architecture/adr-0002-scene-autoload-structure.md
    added: 2026-05-16
    revised: ""

