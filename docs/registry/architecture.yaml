# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-05-24"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: event_catalogue
    status: active
    owner_system: event-bus
    adr: docs/architecture/adr-0001-eventbus-architecture.md
    interface: "70 typed GDScript signals declared on EventBus Autoload. Read-only for all systems — only EventBus declares signals; systems emit and subscribe."
    write_access: event-bus-only
    referenced_by:
      - docs/architecture/adr-0001-eventbus-architecture.md
    added: 2026-05-15
    revised: ""

  - state: autoload_boot_order
    status: active
    owner_system: scene-manager
    adr: docs/architecture/adr-0002-scene-autoload-structure.md
    interface: "Project Settings → Autoloads: EventBus(1), SavePersistence(2), Grid(3), Pathfinding(4), GameDataRegistry(5), SceneManager(6), WaveManager(7). Order is a build invariant — adding a new Autoload requires an ADR revision. GameDataRegistry added at position 5 by ADR-0009 (SceneManager shifted from 5 to 6). WaveManager added at position 7 by ADR-0012."
    write_access: project-settings-only
    referenced_by:
      - docs/architecture/adr-0002-scene-autoload-structure.md
      - docs/architecture/adr-0009-resource-data-model.md
      - docs/architecture/adr-0012-wave-manager-fsm.md
    added: 2026-05-16
    revised: "2026-05-23 — ADR-0009 added GameDataRegistry at position 5; SceneManager shifted to 6"

  - state: save_slot_data
    status: active
    owner_system: save-persistence
    adr: docs/architecture/adr-0003-save-file-format.md
    interface: "SavePersistence._read_slot(slot: int) -> Dictionary; SavePersistence._write_slot(slot: int, data: Dictionary) -> bool. Systems expose state via get_save_data() -> Dictionary and apply_save_data(data: Dictionary). No system reads or writes save files directly."
    write_access: save-persistence-only
    referenced_by:
      - docs/architecture/adr-0003-save-file-format.md
    added: 2026-05-16
    revised: ""

  - state: route_templates
    status: active
    owner_system: pathfinding
    adr: docs/architecture/adr-0004-pathfinding-strategy.md
    interface: "PathfindingSystem.get_path(from_cell: Vector2i, tier: int) -> Array[Vector2i]. PathfindingSystem.would_block_all_paths(cells: Array[Vector2i]) -> bool. No system accesses AStar2D instances or RouteTemplate structs directly — all path queries go through get_path()."
    write_access: pathfinding-only
    referenced_by:
      - docs/architecture/adr-0004-pathfinding-strategy.md
    added: 2026-05-16
    revised: ""

  - state: tower_mission_state
    status: active
    owner_system: tower-system
    adr: docs/architecture/adr-0008-tower-placement-gate.md
    interface: "TowerSystem internal — TowerMissionState Resources keyed by tower_id. Created via duplicate_deep() at placement commit; freed (RefCounted release) on remove_tower() or mission end. Not accessible to other systems — mission-instance state is private to Tower System."
    write_access: tower-system-only
    referenced_by:
      - docs/architecture/adr-0008-tower-placement-gate.md
    added: 2026-05-19
    revised: ""

  - state: grid_cell_data
    status: active
    owner_system: grid
    adr: docs/architecture/adr-0005-grid-system-data-model.md
    interface: "Grid read API (Autoload direct call — documented exception to EventBus rule): get_cell_type(), get_occupant(), is_placeable(), is_footprint_placeable(), get_all_occupied_cells(), get_occupied_cells_in_radius(), get_towers_in_range(), get_spawn_cells(), get_goal_cells(), get_walkable_cell_map(), world_to_cell(), cell_to_world(), is_in_bounds(). Write API restricted to Tower System: place_tower(tower_id, top_left, size) -> Error, remove_tower(tower_id)."
    write_access: tower-system-only
    referenced_by:
      - docs/architecture/adr-0005-grid-system-data-model.md
    added: 2026-05-16
    revised: ""

  - state: monster_entity_state
    status: active
    owner_system: monster-manager
    adr: docs/architecture/adr-0006-monster-movement.md
    interface: "MonsterManager internal — active_monsters: Array[MonsterEntity] (lifecycle_state, current_hp, current_path, path_step_index); _pending_damage: Array[MonsterDamageTaken] (buffered, drained each frame); _pending_absorbed: Dictionary[int, float] (frame-scoped, flushed each frame). Not accessible to other systems — all observable monster state exposed via EventBus events (monster_spawned, monster_died, boss_hp_changed, monster_hp_absorbed)."
    write_access: monster-manager-only
    referenced_by:
      - docs/architecture/adr-0006-monster-movement.md
    added: 2026-05-22
    revised: ""

  - state: game_entity_resource_lookup
    status: active
    owner_system: game-data-registry
    adr: docs/architecture/adr-0009-resource-data-model.md
    interface: "GameDataRegistry.get_monster_resource(monster_id: StringName) -> MonsterResource (null if not found). GameDataRegistry.get_perk_registry() -> TowerPerkRegistry. GameDataRegistry preloads all MonsterResources from assets/data/monsters/ at boot (position 5 in Autoload order) and validates each via validate(). No other system accesses MonsterResource or TowerPerkRegistry by direct path. WaveConfig loaded per-mission by Wave Manager via ResourceLoader.load(wave_config_path). TowerComponent Resources loaded by Save & Persistence."
    write_access: game-data-registry-only
    referenced_by:
      - docs/architecture/adr-0009-resource-data-model.md
    added: 2026-05-23
    revised: ""

  - state: damage_pipeline_state
    status: active
    owner_system: damage-status
    adr: docs/architecture/adr-0007-damage-pipeline.md
    interface: "D&S internal — _lifesteal_pending: Dictionary[int, float] (target_id → hero_lifesteal_fraction, registered before await defer, resolved on monster_hp_absorbed receipt, cleared on wave_completed). Not accessible to other systems. Observable outputs only via EventBus: monster_damage_taken (MonsterDamageTaken Resource), hero_healed(amount: int), hero_damage_taken(amount: int, source_type: int)."
    write_access: damage-status-only
    referenced_by:
      - docs/architecture/adr-0007-damage-pipeline.md
    added: 2026-05-23
    revised: ""

  - state: wave_phase_state
    status: active
    owner_system: wave-manager
    adr: docs/architecture/adr-0012-wave-manager-fsm.md
    interface: "WaveManager internal — _phase: Phase enum (IDLE, SCOUT, PRE_WAVE, WAVE_ACTIVE, INTERMISSION, MISSION_COMPLETE, DEFEAT). Not accessible to other systems — observable only via EventBus events: mission_phase_changed(from_phase, to_phase), wave_started, wave_completed. All transitions go through WaveManager._transition_to(new_phase); direct _phase assignment outside this method is forbidden."
    write_access: wave-manager-only
    referenced_by:
      - docs/architecture/adr-0012-wave-manager-fsm.md
    added: 2026-05-24
    revised: ""

  - state: hero_tower_cache
    status: active
    owner_system: hero-system
    adr: docs/architecture/adr-0010-hero-tower-synced-class.md
    interface: "HeroSystem internal — _tower_cache: Dictionary (tower_id:int → {archetype:StringName, cell:Vector2i}). Populated exclusively via EventBus subscriptions: tower_placed, tower_removed, tower_destroyed. Not accessible to other systems. Exposed indirectly via get_tower_affinity_bonus() and get_primary_class() read-only methods."
    write_access: hero-system-only
    referenced_by:
      - docs/architecture/adr-0010-hero-tower-synced-class.md
    added: 2026-05-24
    revised: ""

  - state: hero_proximity_time
    status: active
    owner_system: hero-system
    adr: docs/architecture/adr-0010-hero-tower-synced-class.md
    interface: "HeroSystem internal — _proximity_time: Dictionary (archetype:StringName → elapsed_seconds:float). Accumulated in _physics_process during WAVE_ACTIVE + INTERMISSION only. Not accessible to other systems. Observable only via hero_class_unlocked EventBus event when a threshold is crossed."
    write_access: hero-system-only
    referenced_by:
      - docs/architecture/adr-0010-hero-tower-synced-class.md
    added: 2026-05-24
    revised: ""

  - state: hero_tower_affinity_bonus
    status: active
    owner_system: hero-system
    adr: docs/architecture/adr-0010-hero-tower-synced-class.md
    interface: "HeroSystem internal — _tower_affinity_bonus: float (range [0.0, 2.0]). Recomputed on every tower_placed, tower_removed, tower_destroyed event via _recompute_tower_affinity(). Not per-frame. Accessible read-only via HeroSystem.get_tower_affinity_bonus() -> float. Applied as a multiplier to affinity_stat after Formula 1."
    write_access: hero-system-only
    referenced_by:
      - docs/architecture/adr-0010-hero-tower-synced-class.md
    added: 2026-05-24
    revised: ""

