      - tarot-deck-ui
    adr: docs/architecture/adr-0032-presentation-shell-hosting-pattern.md
    signal_signature: "A shell owns a Control host node (RoomHost/ScreenHost, full-rect minus chrome). Hosted content is destroyed and recreated on every switch, never kept alive-hidden. Outgoing content teardown runs 2 synchronous steps in order BEFORE queue_free(): (1) disconnect every EventBus subscription the instance itself owns, (2) set_process_unhandled_input(false). Any shell-level transition tween is host-owned, never content-instance-owned. Hand-off transitions (to a different top-level shell) share one _departing flag per shell; whichever handler fires first, its first EventBus-touching/state-mutating statement sets the flag AND synchronously disconnects every EventBus subscription the shell itself owns — flag-check alone does not stop an already-queued CONNECT_DEFERRED call. Generalizes mission_hud.gd's existing Planning Cluster / _terminal precedent (Epic 09, shipped) to shells with more than one hosted-content type and more than one hand-off trigger."
    referenced_by:
      - docs/architecture/adr-0032-presentation-shell-hosting-pattern.md
      - docs/architecture/adr-0031-mission-hud-architecture.md   # direct precedent this pattern generalizes
    added: 2026-07-24
    revised: ""

